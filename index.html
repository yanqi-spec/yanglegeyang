<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>羊了个羊 · 超级地狱 Pro | 最终修复版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 12px 20px;
      color: #333;
    }
    h1 {
      margin: 10px 0 8px;
      font-size: 26px;
      color: #d32f2f;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      text-align: center;
    }
    .stats {
      display: flex;
      gap: 12px;
      margin: 8px 0;
      font-size: 15px;
      font-weight: bold;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(255,255,240,0.85);
      padding: 6px 16px;
      border-radius: 48px;
      backdrop-filter: blur(4px);
    }
    .tray {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 12px 0;
      width: 95%;
      max-width: 700px;
      flex-wrap: wrap;
    }
    .tray-slot {
      width: 68px;
      height: 68px;
      border: 3px dashed #8b5a2b;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff6e5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .tray-slot.filled {
      border-style: solid;
      border-color: #2e7d32;
      background: #e8f5e9;
    }
    .tray-slot img {
      width: 54px;
      height: 54px;
      object-fit: contain;
    }
    .game-area {
      position: relative;
      width: 95%;
      max-width: 780px;
      height: 55vh;
      min-height: 460px;
      background: #fef7e0;
      border-radius: 28px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.25);
      overflow-y: auto;
      overflow-x: hidden;
      margin: 8px auto;
    }
    /* 内部容器保证绝对定位元素能滚动可见 */
    .blocks-wrapper {
      position: relative;
      min-height: 100%;
      width: 100%;
    }
    .block {
      position: absolute;
      width: 72px;
      height: 72px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 14px;
      background: white;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: transform 0.12s, filter 0.1s;
      z-index: 1;
    }
    .block:hover {
      transform: translateY(-4px) scale(1.03);
      z-index: 20 !important;
    }
    .block.removed {
      opacity: 0;
      pointer-events: none;
      transform: scale(0);
      transition: 0.2s;
    }
    .block.is-covered-hint {
      border: 3px solid #ff4444;
      box-shadow: 0 0 10px red;
    }
    .block.god-mode-hover {
      border: 3px solid #ffd966;
      box-shadow: 0 0 16px gold;
    }
    .block img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      pointer-events: none;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 20px;
      font-size: 16px;
      font-weight: bold;
      background: #ff6f00;
      color: white;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }
    button:hover {
      background: #e65100;
      transform: scale(1.02);
    }
    .message {
      margin: 8px;
      font-size: 18px;
      font-weight: bold;
      min-height: 44px;
      color: #b71c1c;
      text-align: center;
      background: rgba(255,255,200,0.7);
      border-radius: 60px;
      padding: 5px 12px;
      display: inline-block;
      width: auto;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.25s;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: white;
      width: 90%;
      max-width: 480px;
      padding: 24px 20px;
      border-radius: 36px;
      text-align: center;
      box-shadow: 0 20px 35px rgba(0,0,0,0.4);
    }
    .danmaku-container {
      height: 50px;
      overflow: hidden;
      position: relative;
      margin: 12px 0;
      background: #fff3e0;
      border-radius: 40px;
    }
    .danmaku-text {
      position: absolute;
      white-space: nowrap;
      font-size: 18px;
      font-weight: bold;
      color: #d32f2f;
      animation: scrollDanmaku 7s linear infinite;
    }
    @keyframes scrollDanmaku {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }
    .input-group input {
      width: 75%;
      padding: 8px 12px;
      font-size: 16px;
      border: 2px solid #ffb74d;
      border-radius: 50px;
      text-align: center;
      margin: 10px 0;
    }
    .error {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 5px;
      min-height: 24px;
      font-weight: 500;
    }
    .history-panel {
      position: fixed;
      right: 10px;
      top: 100px;
      width: 190px;
      background: rgba(255, 245, 220, 0.94);
      padding: 10px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      font-size: 12px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.2);
      z-index: 800;
      max-height: 440px;
      overflow-y: auto;
    }
    .god-mode-badge {
      position: fixed;
      top: 10px;
      right: 12px;
      background: linear-gradient(135deg, #ffd700, #ffb347);
      color: #3e2a1f;
      padding: 4px 12px;
      border-radius: 30px;
      font-weight: bold;
      z-index: 999;
      display: none;
      font-size: 12px;
    }
    .hint-footer {
      position: fixed;
      left: 8px;
      bottom: 12px;
      background: rgba(0,0,0,0.55);
      color: #ffecb3;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 10px;
      z-index: 900;
    }
    .music-player {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 190px;
      height: 54px;
      border: none;
      border-radius: 16px;
      opacity: 0.85;
      z-index: 990;
    }
    @media (max-width: 640px) {
      .block { width: 64px; height: 64px; }
      .block img { width: 50px; height: 50px; }
      .tray-slot { width: 58px; height: 58px; }
      .tray-slot img { width: 46px; height: 46px; }
      .stats { font-size: 12px; gap: 8px; }
      .history-panel { width: 165px; top: 80px; right: 5px; }
      .game-area { height: 52vh; min-height: 420px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="god-mode-badge" id="godModeBadge">👑 大佬模式 ON</div>
<div class="hint-footer">💡 加油</div>
<div class="history-panel" id="historyPanel">
  <h3>📜 最近10局</h3>
  <div id="historyContent">✨ 暂无记录</div>
</div>
<h1>🐏 羊了个羊 · 地狱之三</h1>
<div class="stats">
  <div>🌍 关卡：<span id="level">1</span></div>
  <div>⭐ 得分：<span id="score">0</span></div>
  <div>🧩 剩余：<span id="remaining">0</span></div>
  <div>↩️ 撤回：<span id="undoCount">0</span></div>
  <div>🏆 最高分：<span id="highScore">0</span> | 最高关：<span id="highLevel">1</span></div>
</div>
<div class="tray" id="tray"></div>
<div class="game-area" id="gameArea"><div class="blocks-wrapper" id="blocksWrapper"></div></div>
<div class="message" id="message">✨ 点击方块，集齐三个相同消除</div>
<div class="controls">
  <button id="newGameBtn">✨ 新游戏</button>
  <button id="undoBtn">🙏 撤回请求</button>
  <button id="godEliminateBtn" style="display: none;">⚡ 无敌消除模式</button>
</div>

<!-- 模态窗 -->
<div id="winModal" class="modal-overlay"><div class="modal"><h2>🎉 第一关通关！</h2><div class="danmaku-container"><div class="danmaku-text">太棒啦！来试试第二关吧~</div></div><input type="text" id="passInput" placeholder="请输入：加油"><div id="errorMsg" class="error"></div><button onclick="tryNextLevel()">✨ 进入第二关</button></div></div>
<div id="secondWinModal" class="modal-overlay"><div class="modal"><h2>🏆 第二关通关！</h2><div class="danmaku-container"><div class="danmaku-text">大神敢挑战地狱第三关吗？😈</div></div><input type="text" id="secondPassInput" placeholder="请输入：我不怕"><div id="secondErrorMsg" class="error"></div><button onclick="tryThirdLevel()">🔥 闯入第三关</button></div></div>
<div id="undoModal" class="modal-overlay"><div class="modal"><h2>🥺 求求羊神</h2><div id="undoPrompt"></div><input type="text" id="undoInput" placeholder="输入提示内容"><div id="undoError" class="error"></div><button id="confirmUndoBtn">求你了！</button></div></div>
<div id="failModal" class="modal-overlay"><div class="modal"><h2>💀 槽位爆满</h2><p>撤回或重新开始吧~</p><button onclick="closeFailModal()">确定</button></div></div>
<div id="fullTrayModal" class="modal-overlay"><div class="modal"><h2>⚠️ 卡槽已满</h2><p>消除三个相同卡片或撤回</p><button onclick="closeFullModal()">知道了</button></div></div>
<div id="rankModal" class="modal-overlay"><div class="modal"><h2>🏆 通关龙虎榜</h2><p>本次得分：<strong id="finalScore">0</strong>  撤回：<strong id="finalUndo">0</strong></p><div id="leaderboardList" style="max-height:200px; overflow:auto; text-align:left; margin:12px 0;"></div><button onclick="closeRankModal()">关闭</button></div></div>
<iframe class="music-player" src="//music.163.com/outchain/player?type=2&id=2600493765&auto=1&height=66" frameborder="0"></iframe>

<script>
  // ---------- 图库 ----------
  const baseImageUrls = [
    'https://pic1.imgdb.cn/item/6938d02af9354404e342de8b.jpg',
    'https://pic1.imgdb.cn/item/6938d02af9354404e342de88.webp',
    'https://pic1.imgdb.cn/item/6938d02af9354404e342de8a.jpg',
    'https://pic1.imgdb.cn/item/6938d02af9354404e342de8c.jpg',
    'https://pic1.imgdb.cn/item/6938d02af9354404e342de89.webp',
    'https://pic1.imgdb.cn/item/6937f2cb00233646958d8a46.jpg',
    'https://pic1.imgdb.cn/item/6937f2c600233646958d8a44.webp',
    'https://pic1.imgdb.cn/item/6937f2c300233646958d8a41.webp',
    'https://pic1.imgdb.cn/item/6937f2c000233646958d8a40.jpg',
    'https://pic1.imgdb.cn/item/6937f2bc00233646958d8a3a.png'
  ];
  const thirdLevelImageUrls = [
    'https://pic1.imgdb.cn/item/693a66060edaae20ec55fdaa.jpg',
    'https://pic1.imgdb.cn/item/693a66060edaae20ec55fdaf.jpg',
    'https://pic1.imgdb.cn/item/693a66060edaae20ec55fdac.jpg',
    'https://pic1.imgdb.cn/item/693a66060edaae20ec55fdab.jpg',
    'https://pic1.imgdb.cn/item/693a66060edaae20ec55fdae.jpg',
    'https://pic1.imgdb.cn/item/693a66170edaae20ec55fe3f.jpg',
    'https://pic1.imgdb.cn/item/693a66170edaae20ec55fe41.png',
    'https://pic1.imgdb.cn/item/693a66170edaae20ec55fe40.jpg',
    'https://pic1.imgdb.cn/item/693a66170edaae20ec55fe3c.jpg',
    'https://pic1.imgdb.cn/item/693a66170edaae20ec55fe3d.jpg',
    'https://pic1.imgdb.cn/item/693a66230edaae20ec55feaf.png',
    'https://pic1.imgdb.cn/item/693a66220edaae20ec55feaa.jpg',
    'https://pic1.imgdb.cn/item/693a66230edaae20ec55feae.jpg',
    'https://pic1.imgdb.cn/item/693a66230edaae20ec55feb2.png',
    'https://pic1.imgdb.cn/item/693a66230edaae20ec55feab.png'
  ];

  let currentLevel = 1;
  const TRAY_MAX = 7;
  let blocks = [];
  let tray = [];
  let historyStack = [];
  let score = 0;
  let totalRemain = 0;
  let freeUndoUsed = false;
  let godMode = false;
  let godEliminateMode = false;
  let undoCount = 0;
  let startTime = Date.now();
  let highScore = parseInt(localStorage.getItem('sheepHighScore')) || 0;
  let highLevel = parseInt(localStorage.getItem('sheepHighLevel')) || 1;
  let leaderboard = JSON.parse(localStorage.getItem('sheepLeaderboard') || '[]');
  let recentGames = JSON.parse(localStorage.getItem('sheepRecentGames') || '[]');

  const mercyPhrases = [
    { key: '求求你了', display: '求求你了' }, { key: '我错了', display: '我错了' },
    { key: '放过我吧', display: '放过我吧' }, { key: '羊羊大人', display: '羊羊大人' },
    { key: '给次机会', display: '给次机会' }, { key: '羊神保佑', display: '羊神保佑' }
  ];
  let currentMercy = null;

  const gameAreaDiv = document.getElementById('gameArea');
  const wrapper = document.getElementById('blocksWrapper');
  const trayContainer = document.getElementById('tray');
  const messageBox = document.getElementById('message');
  const levelSpan = document.getElementById('level');
  const scoreSpan = document.getElementById('score');
  const remainingSpan = document.getElementById('remaining');
  const undoCountSpan = document.getElementById('undoCount');
  const highScoreSpan = document.getElementById('highScore');
  const highLevelSpan = document.getElementById('highLevel');
  highScoreSpan.textContent = highScore;
  highLevelSpan.textContent = highLevel;

  function updateHistoryPanel() {
    const contentDiv = document.getElementById('historyContent');
    if (!recentGames.length) { contentDiv.innerHTML = '暂无对局'; return; }
    let html = '';
    recentGames.slice(0,10).forEach((g,idx) => {
      html += `<div style="border-bottom:1px solid #ffe0b5;padding:6px 0;">🏅 ${idx+1} 得分${g.score} ⏱️${g.timeSec}s</div>`;
    });
    contentDiv.innerHTML = html;
  }
  function addRecentGame(scoreVal, timeSec) {
    recentGames.unshift({ score: scoreVal, timeSec });
    if(recentGames.length > 10) recentGames.pop();
    localStorage.setItem('sheepRecentGames', JSON.stringify(recentGames));
    updateHistoryPanel();
  }
  function saveRecord() {
    if (score > highScore) { highScore = score; localStorage.setItem('sheepHighScore', highScore); highScoreSpan.textContent = highScore; }
    if (currentLevel > highLevel) { highLevel = currentLevel; localStorage.setItem('sheepHighLevel', highLevel); highLevelSpan.textContent = highLevel; }
  }
  function addToLeaderboard(finalSc, undoCnt) {
    const timeSec = Math.floor((Date.now() - startTime)/1000);
    leaderboard.unshift({ level: currentLevel, score: finalSc, undoCount: undoCnt, timeSec });
    if(leaderboard.length > 5) leaderboard.pop();
    localStorage.setItem('sheepLeaderboard', JSON.stringify(leaderboard));
  }
  function showLeaderboard(finalSc, undoCnt) {
    addToLeaderboard(finalSc, undoCnt);
    const timeUsed = Math.floor((Date.now() - startTime)/1000);
    addRecentGame(finalSc, timeUsed);
    document.getElementById('finalScore').textContent = finalSc;
    document.getElementById('finalUndo').textContent = undoCnt;
    const listDiv = document.getElementById('leaderboardList');
    listDiv.innerHTML = leaderboard.map((rec,i)=>`<div style="padding:6px; border-bottom:1px solid #eee;">#${i+1} Lv${rec.level} | ${rec.score}分 | 撤回${rec.undoCount}</div>`).join('');
    document.getElementById('rankModal').classList.add('active');
  }

  // ---------- 构建关卡 (修复长度不匹配 + 3倍数保证) ----------
  function buildLevelData(level) {
    let newBlocks = [];
    let imagePool = [];
    let totalTarget = 0;
    let layersConfig = [];
    if(level === 1) {
      imagePool = [...baseImageUrls].sort(()=>0.5-Math.random()).slice(0,6);
      totalTarget = 54;
      layersConfig = [{ count: 18, offset: 0 }, { count: 18, offset: 45 }, { count: 18, offset: 90 }];
    } else if(level === 2) {
      imagePool = [...baseImageUrls].sort(()=>0.5-Math.random()).slice(0,9);
      totalTarget = 135;
      layersConfig = [{ count: 22, offset: 0 }, { count: 24, offset: 35 }, { count: 26, offset: 70 }, { count: 28, offset: 105 }, { count: 35, offset: 140 }];
    } else {
      // 第三关：每种图片3倍数 + 总数确保与层数匹配
      let combined = [...thirdLevelImageUrls, ...baseImageUrls.slice(0,4)];
      combined = [...new Map(combined.map((u,i)=>[u,i])).keys()];
      const variantCount = Math.min(combined.length, Math.floor(Math.random() * 5) + 10); // 10~14种
      let selectedTypes = combined.slice(0, variantCount);
      let times = (Math.floor(Math.random() * 3) + 8) * 3; // 24,27,30 每种出现次数
      totalTarget = selectedTypes.length * times;
      let cardPool = [];
      for(let t of selectedTypes) for(let i=0;i<times;i++) cardPool.push(t);
      for(let i=cardPool.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [cardPool[i],cardPool[j]]=[cardPool[j],cardPool[i]]; }
      const layerAmount = Math.min(10, Math.max(7, Math.floor(totalTarget / 45)));
      layersConfig = [];
      let remaining = totalTarget;
      let off = 0;
      for(let i=0;i<layerAmount;i++) {
        let cnt = Math.floor(remaining / (layerAmount - i));
        cnt = Math.min(55, Math.max(28, cnt));
        layersConfig.push({ count: cnt, offset: off });
        off += 34;
        remaining -= cnt;
      }
      if(remaining > 0) layersConfig[layersConfig.length-1].count += remaining;
      let idxCard = 0;
      const areaW = gameAreaDiv.clientWidth || 700;
      const xStep = 78, yStep = 70;
      for(let l=0; l<layersConfig.length; l++) {
        const lay = layersConfig[l];
        let cols = 7; if(areaW > 750) cols = 8; else if(areaW < 580) cols = 6;
        const rows = Math.ceil(lay.count / cols);
        const totalW = cols * xStep;
        const startX = (areaW - totalW) / 2;
        for(let i=0; i<lay.count && idxCard < cardPool.length; i++) {
          const col = i % cols;
          const row = Math.floor(i / cols);
          let x = startX + col * xStep + (Math.random() * 6 - 3);
          let y = 25 + row * yStep + lay.offset + (Math.random() * 5);
          x = Math.min(Math.max(x, 5), areaW-74);
          newBlocks.push({
            id: newBlocks.length,
            imageUrl: cardPool[idxCard],
            x: x, y: y,
            layer: lay.offset + row * 3,
            removed: false,
            coveredBy: []
          });
          idxCard++;
        }
      }
      // 确保所有卡片都用完
      while(idxCard < cardPool.length) {
        let lastLayer = layersConfig[layersConfig.length-1];
        let x = 50 + Math.random() * (areaW-120);
        let y = 40 + lastLayer.offset + 200;
        newBlocks.push({
          id: newBlocks.length, imageUrl: cardPool[idxCard], x: x, y: y,
          layer: lastLayer.offset + 220, removed: false, coveredBy: []
        });
        idxCard++;
      }
      // 覆盖关系不重复计算优化 (只比较一次)
      for(let i=0;i<newBlocks.length;i++) {
        for(let j=i+1;j<newBlocks.length;j++) {
          const a = newBlocks[i], b = newBlocks[j];
          if(b.layer > a.layer && Math.abs(a.x-b.x) < 76 && Math.abs(a.y-b.y) < 72) {
            a.coveredBy.push(b.id);
          } else if(a.layer > b.layer && Math.abs(a.x-b.x) < 76 && Math.abs(a.y-b.y) < 72) {
            b.coveredBy.push(a.id);
          }
        }
      }
      return newBlocks;
    }
    // 普通关卡构建 (保证总数匹配)
    let cardArr = [];
    for(let i=0;i<totalTarget;i++) cardArr.push(imagePool[i % imagePool.length]);
    for(let i=cardArr.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [cardArr[i],cardArr[j]]=[cardArr[j],cardArr[i]]; }
    const areaW = gameAreaDiv.clientWidth || 700;
    const xStep = 78, yStep = 70;
    let idx = 0;
    for(let l=0; l<layersConfig.length; l++) {
      const lay = layersConfig[l];
      let cols = (level === 2) ? 6 : 5;
      const rows = Math.ceil(lay.count / cols);
      const totalW = cols * xStep;
      const startX = (areaW - totalW) / 2;
      for(let i=0; i<lay.count && idx < cardArr.length; i++) {
        const col = i % cols, row = Math.floor(i / cols);
        let x = startX + col * xStep + (Math.random() * 6 - 3);
        let y = 30 + row * yStep + lay.offset;
        x = Math.min(Math.max(x, 8), areaW-78);
        newBlocks.push({ id: newBlocks.length, imageUrl: cardArr[idx], x, y, layer: lay.offset + row*2, removed: false, coveredBy: [] });
        idx++;
      }
    }
    for(let i=0;i<newBlocks.length;i++) {
      for(let j=i+1;j<newBlocks.length;j++) {
        const a=newBlocks[i], b=newBlocks[j];
        if(b.layer > a.layer && Math.abs(a.x-b.x)<76 && Math.abs(a.y-b.y)<70) a.coveredBy.push(b.id);
        else if(a.layer > b.layer && Math.abs(a.x-b.x)<76 && Math.abs(a.y-b.y)<70) b.coveredBy.push(a.id);
      }
    }
    return newBlocks;
  }

  function renderGame() {
    if (!wrapper) return;
    wrapper.innerHTML = '';
    const isFailState = tray.length > TRAY_MAX;
    blocks.forEach(block => {
      if(block.removed) return;
      const div = document.createElement('div');
      div.className = 'block';
      if(godMode && godEliminateMode) {
        div.classList.add('god-mode-hover');
        div.onclick = () => clickBlock(block.id);
      } else if(isFailState) {
        div.style.opacity = '0.5';
        div.style.cursor = 'default';
      } else if(isClickable(block)) {
        div.onclick = () => clickBlock(block.id);
      } else {
        div.style.opacity = '0.5';
        div.style.cursor = 'default';
      }
      if(godMode && !godEliminateMode && !isClickable(block) && !block.removed) div.classList.add('is-covered-hint');
      const img = document.createElement('img');
      img.src = block.imageUrl;
      div.appendChild(img);
      div.style.left = (block.x - 36) + 'px';
      div.style.top = (block.y - 36) + 'px';
      wrapper.appendChild(div);
    });
    // 渲染槽位
    trayContainer.innerHTML = '';
    for(let i=0;i<TRAY_MAX;i++) {
      const slot = document.createElement('div');
      slot.className = 'tray-slot';
      if(i < tray.length) {
        const img = document.createElement('img');
        img.src = tray[i];
        slot.appendChild(img);
        slot.classList.add('filled');
      }
      trayContainer.appendChild(slot);
    }
  }
  
  function isClickable(block) {
    if(block.removed) return false;
    if(godMode && godEliminateMode) return true;
    return block.coveredBy.every(id => blocks.find(b=>b.id===id)?.removed === true);
  }

  // 消除得分修复：不会负数，正确累加
  function checkEliminate() {
    if(tray.length < 3) return false;
    let last = tray[tray.length-1];
    let indices = [];
    for(let i=0;i<tray.length;i++) if(tray[i]===last) indices.push(i);
    if(indices.length >= 3) {
      let removedCount = 0;
      while(tray.includes(last)) {
        let pos = tray.indexOf(last);
        if(pos !== -1) { tray.splice(pos,1); removedCount++; }
      }
      const basePoints = currentLevel === 3 ? 50 : 30;
      const addedScore = basePoints * (removedCount / 3);
      score += addedScore;
      if(score < 0) score = 0;
      updateScoreUI();
      messageBox.textContent = `🎉 消除 +${addedScore} 分！`;
      setTimeout(()=>{ if(messageBox.textContent.includes('消除')) messageBox.textContent = '继续挑战～'; }, 1300);
      return true;
    }
    return false;
  }
  function updateScoreUI() { scoreSpan.textContent = Math.floor(score); }

  function clickBlock(id) {
    const block = blocks.find(b=>b.id===id);
    if(!block || block.removed) return;
    if(godMode && godEliminateMode) {
      const targetUrl = block.imageUrl;
      const toRemove = blocks.filter(b=>!b.removed && b.imageUrl===targetUrl);
      if(toRemove.length===0) return;
      historyStack.push({ type: 'god', removedIds: toRemove.map(b=>b.id), prevTray: [...tray] });
      toRemove.forEach(b=>{ b.removed = true; totalRemain--; });
      score += toRemove.length * 20;
      if(score<0) score=0;
      updateScoreUI();
      remainingSpan.textContent = totalRemain;
      renderGame();
      if(totalRemain===0) victoryProcess();
      return;
    }
    if(tray.length >= TRAY_MAX) {
      document.getElementById('fullTrayModal').classList.add('active');
      return;
    }
    if(!isClickable(block)) return;
    historyStack.push({ type: 'normal', blockId: block.id, prevTray: [...tray] });
    block.removed = true;
    tray.push(block.imageUrl);
    totalRemain--;
    remainingSpan.textContent = totalRemain;
    const eliminated = checkEliminate();
    if(!eliminated && tray.length > TRAY_MAX) {
      document.getElementById('failModal').classList.add('active');
      saveRecord();
    }
    renderGame();
    if(totalRemain === 0) victoryProcess();
  }

  function victoryProcess() {
    saveRecord();
    if(currentLevel===1) document.getElementById('winModal').classList.add('active');
    else if(currentLevel===2) document.getElementById('secondWinModal').classList.add('active');
    else showLeaderboard(score, undoCount);
  }

  function performUndoLogic() {
    if(historyStack.length===0){ alert('没有可撤回的操作'); return; }
    const last = historyStack.pop();
    if(last.type === 'normal') {
      const blk = blocks.find(b=>b.id===last.blockId);
      if(blk) blk.removed = false;
      tray = [...last.prevTray];
      totalRemain++;
    } else if(last.type === 'god') {
      last.removedIds.forEach(id=>{ let b=blocks.find(bb=>bb.id===id); if(b) b.removed=false; });
      tray = [...last.prevTray];
      totalRemain += last.removedIds.length;
      score -= last.removedIds.length * 18;
      if(score<0) score=0;
      updateScoreUI();
    }
    undoCount++;
    undoCountSpan.textContent = undoCount;
    remainingSpan.textContent = totalRemain;
    renderGame();
    if(tray.length <= TRAY_MAX) document.getElementById('failModal').classList.remove('active');
    messageBox.textContent = `↩️ 撤回成功 (已用${undoCount}次)`;
    setTimeout(()=>{ if(messageBox.textContent.includes('撤回')) messageBox.textContent = '继续挑战'; }, 1500);
  }

  function requestUndoWrapper() {
    if(historyStack.length===0){ alert('没有操作可撤回'); return; }
    if(godMode) { performUndoLogic(); return; }
    if(!freeUndoUsed) { freeUndoUsed=true; performUndoLogic(); }
    else {
      let phraseSet = [...mercyPhrases];
      if(currentLevel===3) phraseSet.push({key:'羊神无敌',display:'羊神无敌'});
      currentMercy = phraseSet[Math.floor(Math.random()*phraseSet.length)];
      document.getElementById('undoPrompt').innerHTML = `🔮 请虔诚输入：“${currentMercy.display}”`;
      document.getElementById('undoInput').value = '';
      document.getElementById('undoError').textContent = '';
      document.getElementById('undoModal').classList.add('active');
    }
  }
  function confirmUndoInput() {
    let inputVal = document.getElementById('undoInput').value.trim().toLowerCase().replace(/\s/g,'');
    if(inputVal === currentMercy.key.toLowerCase().replace(/\s/g,'')){
      document.getElementById('undoModal').classList.remove('active');
      performUndoLogic();
    } else {
      document.getElementById('undoError').textContent = '心不诚则灵~ 再试试';
    }
  }
  function newGameStart() {
    blocks = buildLevelData(currentLevel);
    totalRemain = blocks.length;
    remainingSpan.textContent = totalRemain;
    score = 0; updateScoreUI(); undoCount=0; undoCountSpan.textContent=0; historyStack=[]; tray=[];
    freeUndoUsed = false;
    godEliminateMode = false;
    document.getElementById('godEliminateBtn').style.background = "#d4af37";
    startTime = Date.now();
    renderGame();
    messageBox.textContent = currentLevel===3 ? '🔥地狱第三关，每种卡片都是3的倍数，祝你通关！' : '新的一局，加油！';
  }
  function tryNextLevel(){ if(document.getElementById('passInput').value.trim().toLowerCase()==='加油'){ document.getElementById('winModal').classList.remove('active'); currentLevel=2; newGameStart(); } else document.getElementById('errorMsg').textContent='输入“加油”哦～'; }
  function tryThirdLevel(){ if(document.getElementById('secondPassInput').value.trim().toLowerCase()==='我不怕'){ document.getElementById('secondWinModal').classList.remove('active'); currentLevel=3; newGameStart(); } else document.getElementById('secondErrorMsg').textContent='输入“我不怕”进入地狱~'; }
  function toggleGodEliminate() { if(!godMode){ alert('请先按6键6次开启大佬模式'); return; } godEliminateMode = !godEliminateMode; document.getElementById('godEliminateBtn').textContent = godEliminateMode ? '✨ 关闭无敌消除' : '⚡ 无敌消除模式'; renderGame(); }
  function closeModals(){ document.querySelectorAll('.modal-overlay').forEach(m=>m.classList.remove('active')); }
  window.closeFailModal = closeModals; window.closeFullModal = closeModals; window.closeRankModal = closeModals;

  document.getElementById('newGameBtn').onclick = ()=>{ newGameStart(); };
  document.getElementById('undoBtn').onclick = requestUndoWrapper;
  document.getElementById('godEliminateBtn').onclick = toggleGodEliminate;
  document.getElementById('confirmUndoBtn').onclick = confirmUndoInput;
  
  let sixCount=0, lastSix=0;
  document.addEventListener('keydown',(e)=>{
    if(e.key==='6'){
      let now=Date.now(); if(now-lastSix>2000) sixCount=0;
      sixCount++; lastSix=now;
      if(sixCount>=6){ godMode=!godMode; document.getElementById('godModeBadge').style.display=godMode?'block':'none'; document.getElementById('godEliminateBtn').style.display=godMode?'inline-block':'none'; if(!godMode) godEliminateMode=false; renderGame(); sixCount=0; alert(godMode?'大佬模式开启：无限撤回+覆盖提示+无敌开关':'大佬模式关闭');}
    }
  });
  newGameStart();
  const statDiv = document.querySelector('.stats');
  if(!document.getElementById('freeUndoHint')) { let span = document.createElement('span'); span.id='freeUndoHint'; span.textContent='免费'; span.style.marginLeft='8px'; document.querySelector('.stats').appendChild(span); }
</script>
</body>
